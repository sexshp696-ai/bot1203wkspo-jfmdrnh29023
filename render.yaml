services:
  - type: web
    name: phant0m-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    # Render free dorme em 15 min sem tráfego — o bot faz self-ping a cada 9 min em /health pra ficar SEMPRE ON
